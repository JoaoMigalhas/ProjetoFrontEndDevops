<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/login_box.css">
    <link rel="stylesheet" href="./css/style.css">
    <title>Moviedle</title>
</head>
<body>
    <div class="login">
        <div class="loginBox">
            <p class="txtTag">Insira sua tag de jogador!</p>
            <input type="text" id="inputLoginBox" placeholder="AAAA" maxlength="4">
            <button id="buttonLoginBox">OK</button>
        </div>
    </div>
    <main class="card-jogo">
        <div class="titulo">
            <h1>Moviedle</h1>
        </div>
        <div class="card-dicas">
            <h2>Descubra o filme com base nas dicas!!</h2>
        </div>
        <input type="text" placeholder="Digite o nome do filme...">
        <button>
            Enviar
        </button>
    </main>
    <script src="./login_box.js"></script>
</body>
</html>
